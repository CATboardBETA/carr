[package]
name = "carr"
description.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
authors.workspace = true

[dependencies]
bytemuck = { version = "1.25.2", features = ["must_cast", "min_const_generics"] }
itertools = "0.15.0"
rand = { version = "0.10.2", optional = true }
image = { version = "0.25.10", optional = true }
ndarray = { version = "0.17.2", optional = true }
bumpalo = { version = "3.20.4", features = ["allocator_api", "std"] }

[features]
default = []
full = ["rand", "integrations"]

rand = ["dep:rand"]

integrations = ["image", "ndarray"]
image = ["dep:image"]
ndarray = ["dep:ndarray"]
